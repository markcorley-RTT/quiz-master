<style>
/* Layout: one phone-width column, a sticky scoreboard strip at the bottom, category color as the only accent per round. */
:root{
  --bg:#f6f3ee; --surface:#ffffff; --fg:#1c1a17; --muted:#6b655c; --line:#dcd6cc;
  --accent:#2a4bd7; --accent-fg:#ffffff; --good:#1f8a4c; --bad:#c23b3b; --soft:#ece7df;
  --c-geo:#2f6fd6; --c-ent:#d6367a; --c-his:#d9a21b; --c-art:#8a4fd6; --c-sci:#2a9d6b; --c-spo:#e2651d;
  --display:"Sora",system-ui,sans-serif; --body:"Karla",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15141a; --surface:#1f1e26; --fg:#f1eee8; --muted:#a39d93; --line:#34323c;
  --accent:#8fa4ff; --accent-fg:#101225; --good:#4cc77e; --bad:#ff6b6b; --soft:#2a2833;
  --c-geo:#6b9bff; --c-ent:#ff6fae; --c-his:#f2c14e; --c-art:#b58cff; --c-sci:#52d49a; --c-spo:#ff9a55;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15141a; --surface:#1f1e26; --fg:#f1eee8; --muted:#a39d93; --line:#34323c;
  --accent:#8fa4ff; --accent-fg:#101225; --good:#4cc77e; --bad:#ff6b6b; --soft:#2a2833;
  --c-geo:#6b9bff; --c-ent:#ff6fae; --c-his:#f2c14e; --c-art:#b58cff; --c-sci:#52d49a; --c-spo:#ff9a55;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,a{touch-action:manipulation}
#app{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:48px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);width:100%;min-height:48px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{font-size:.85rem;font-weight:700;display:block;margin-bottom:4px}
.code{font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--soft)}
.cat-band{border-radius:14px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:6px}
.cat-band .eyebrow{color:rgba(255,255,255,.8)}
.cat-band h2{color:#fff;font-size:1.6rem}
.qopt{text-align:left;display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;font-weight:500;line-height:1.35}
.qopt .diff{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.pips i.on{background:var(--fg)}
.big-q{font-family:var(--display);font-size:1.4rem;font-weight:600;line-height:1.3}
.answer-box{font-size:1.15rem}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.prow .name{font-weight:700}
.prow .ans{color:var(--muted);font-size:.95rem}
.judge{display:flex;gap:6px}
.judge button{padding:8px 0;min-height:48px;min-width:52px;border-radius:10px;font-size:1.2rem}
.qopt{min-height:64px}
.qopt:active,button.primary:active{transform:scale(.985)}
.judge button.on-good{background:var(--good);color:#fff;border-color:transparent}
.judge button.on-bad{background:var(--bad);color:#fff;border-color:transparent}
.mark{font-weight:800;font-size:.9rem}
.mark.good{color:var(--good)}
.mark.bad{color:var(--bad)}
.delta{font-variant-numeric:tabular-nums;font-weight:800;font-family:var(--display)}
.scoreboard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.scoreboard .rows{display:flex;gap:6px 14px;flex-wrap:wrap}
.scoreboard .srow{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:.95rem}
.scoreboard .srow.me .nm{font-weight:800}
.scoreboard .sc{font-family:var(--display);font-weight:800}
.qm-tag{font-size:.7rem;padding:2px 6px;border-radius:6px;background:var(--soft);color:var(--muted);font-weight:700;letter-spacing:.04em}
.notice{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.notice.err{border:1px solid var(--bad)}
.final{display:flex;flex-direction:column;gap:8px}
.final .frow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.final .frow.first{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.final .rank{font-family:var(--display);font-weight:800;width:28px}
.curve{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:.75rem;text-align:center;color:var(--muted)}
.curve b{display:block;color:var(--fg);font-family:var(--display)}
.seats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:4px 8px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.seatrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seat{padding:8px 4px;min-height:44px;border-radius:10px;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.seat.on{background:var(--fg);color:var(--bg);border-color:transparent}
.seat.on .qm-tag{background:var(--bg);color:var(--fg)}
button.small{min-height:36px;padding:6px 10px;font-size:.85rem;align-self:flex-start}
.wait{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>

// ---------- Scoring ----------
const QM_MAX = 3;
// Bell curve on the share of answerers who got it right: 0 at 0% and 100%, QM_MAX at 50%.
function qmPoints(correct, answerers){
  if(!answerers) return 0;
  const p = correct/answerers;
  return Math.round(QM_MAX * 4 * p * (1-p));
}
const PLAYER_POINTS = 1;

// ---------- Question selection ----------
// Each category gets a set of questions sized to the game (players x 5). Sets come from Gemini when
// available (stored at games/{code}/sets/{cat}) and from the built-in bank otherwise. Every question
// shown to a Quiz Master is retired for the game, and the group's seen list carries across games.
let sets = {};            // catId -> {qs:[...], source}
let groupSeen = [];       // question texts this group of players has already seen
let liveGen = null;       // async (cat, count, years, avoid) => [{q,a,d,y}]
let genPending = {};
let assigning = null;     // turn index whose options this client is currently writing
function generator(){ return sim ? null : liveGen; }
function setSize(){ const n = (game&&game.order&&game.order.length) || Object.keys(players).length || 2; return Math.max(4, n)*5; }
function setRef(catId){ return db.doc('games/'+code+'/sets/'+catId); }
function groupKey(){
  const names = Object.values(players).map(p=>(p.name||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'')).filter(Boolean).sort();
  return names.length ? names.join('-').slice(0,180) : null;
}
function playerYears(){ return Object.values(players).map(p=>+p.year).filter(y=>y>1900&&y<2030); }
function playerNations(){ return [...new Set(Object.values(players).map(p=>p.nation).filter(id=>nationOf(id)))]; }
// A question tagged with nations is only fair game when everyone at the table is from one of them.
function nationOk(q, nations){ return !q.n || !nations.length || nations.every(id=>q.n.includes(id)); }
function setReady(catId){ return !generator() || sets[catId]!==undefined; }
// Category schedule: a shuffled category order per game; the QM and the category both advance every
// turn. Player p in round r hosts catOrder[(r + k*p) % 6], which gives every player all six categories
// exactly once and keeps consecutive turns in different categories.
function catOrder(){ return (game && Array.isArray(game.catOrder) && game.catOrder.length===CATS.length) ? game.catOrder : CATS.map(c=>c.id); }
function catIdForTurn(t){ const n = (game&&game.order&&game.order.length)||1; const k = n===2?3:1; const r=Math.floor(t/n), p=t%n; return catOrder()[(r + k*p) % CATS.length]; }
function catIndexForTurn(t){ return CATS.findIndex(c=>c.id===catIdForTurn(t)); }
function totalTurns(){ return ((game&&game.order&&game.order.length)||0)*CATS.length; }

async function ensureSet(catId){
  if(!generator() || sets[catId]!==undefined || genPending[catId]) return;
  genPending[catId]=true;
  try{
    const cat = CATS.find(c=>c.id===catId);
    const raw = await Promise.race([
      generator()(cat, setSize(), playerYears(), groupSeen.slice(-150), playerNations()),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),90000))
    ]);
    const clean = (Array.isArray(raw)?raw:[]).filter(x=>x&&x.q&&x.a).map((x,i)=>({
      id:'g'+catId+'_'+i, d:Math.min(5,Math.max(1,Math.round(+x.d||3))), q:String(x.q).trim(), a:String(x.a).trim(), y:(+x.y>1000?+x.y:null)
    }));
    if(clean.length<5) throw new Error('too few questions');
    await setRef(catId).set({qs:clean, source:'gemini', at:Date.now()});
  }catch(e){
    console.warn('Question generation failed for '+catId+', using built-in bank.', e);
    try{ await setRef(catId).set({qs:[], source:'bank', at:Date.now(), error:String(e&&e.message||e).slice(0,200)}); }catch(e2){ console.error(e2); }
  }finally{ genPending[catId]=false; }
}

function pickOptions(catId, usedIds){
  const used = new Set(usedIds||[]), seen = new Set(groupSeen);
  const years = playerYears();
  const youngest = years.length?Math.max(...years):1980, oldest = years.length?Math.min(...years):1960;
  const nations = playerNations();
  const weight = q=>{ if(q.y==null) return 1; if(q.y >= youngest+8) return 1; if(q.y >= oldest+8) return .6; return .3; };
  const fresh = q=>!used.has(q.id) && !seen.has(q.q) && nationOk(q, nations);
  const gen = (sets[catId]&&sets[catId].qs)||[];
  const bank = BANK.filter(q=>q.c===catId);
  const out=[];
  for(let d=1; d<=5; d++){
    let pool = gen.filter(q=>q.d===d && fresh(q));
    if(!pool.length) pool = bank.filter(q=>q.d===d && fresh(q));
    if(!pool.length) pool = bank.filter(q=>q.d===d && !used.has(q.id));
    if(!pool.length) pool = bank.filter(q=>!used.has(q.id) && !out.some(o=>o.id===q.id));
    if(!pool.length) pool = bank.filter(q=>!out.some(o=>o.id===q.id));
    if(!pool.length) continue;
    const total = pool.reduce((s,q)=>s+weight(q),0);
    let r = Math.random()*total, pick = pool[pool.length-1];
    for(const q of pool){ r -= weight(q); if(r<=0){ pick=q; break; } }
    out.push({id:pick.id, d:pick.d, q:pick.q, a:pick.a});
  }
  return out;
}

// The Quiz Master's device assigns the five options once the category's set is ready, retires them,
// records them as seen for the group, and prefetches the next category.
async function assignOptionsIfNeeded(){
  if(!game || game.phase!=='pick' || game.options || !isQM() || busy) return;
  const catId = CATS[game.cat].id;
  if(!setReady(catId)){ ensureSet(catId); return; }
  if(assigning===game.turn) return;
  assigning = game.turn;
  try{
    const options = shuffle(pickOptions(catId, game.usedIds));
    const usedIds = (game.usedIds||[]).concat(options.map(o=>o.id));
    await gameRef().set({...game, options, usedIds});
    if(!sim && game.group){
      const texts = options.map(o=>o.q);
      const merged = groupSeen.concat(texts.filter(t=>!groupSeen.includes(t))).slice(-600);
      db.doc('groups/'+game.group).set({seen:merged, at:Date.now()}).catch(e=>console.warn(e));
    }
    for(const t of [game.turn+1, game.turn+2]){ if(t < totalTurns()) ensureSet(catIdForTurn(t)); }
  }catch(e){ console.error(e); assigning=null; }
}

// ---------- Identity & game code ----------
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
let PID = store('qm.pid');
if(!PID){ PID = 'p'+Math.random().toString(36).slice(2,10); store('qm.pid',PID); }
function newCode(){ const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; do{ c=''; for(let i=0;i<4;i++) c+=s[Math.floor(Math.random()*s.length)]; }while(c==='BANK'||c==='DEMO'); return c; }
function codeFromHash(){ const h=(location.hash||'').replace('#','').toUpperCase(); return /^[A-Z0-9]{4}$/.test(h)&&h!=='BANK'?h:null; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- Local store for the single-device demo (same shape as the shared store) ----------
function localStore(){
  const docs = new Map(), listeners = new Set();
  const notify = ()=>listeners.forEach(l=>l());
  const snap = (path)=>({id:path.split('/').pop(), exists:docs.has(path), data:()=>docs.get(path)});
  const docRef = path=>({
    id:path.split('/').pop(), path,
    async get(){ return snap(path); },
    async set(data){ docs.set(path, JSON.parse(JSON.stringify(data))); notify(); },
    async delete(){ docs.delete(path); notify(); },
    onSnapshot(next){ const l=()=>next(snap(path)); listeners.add(l); setTimeout(l,0); return ()=>listeners.delete(l); }
  });
  const colRef = path=>({
    path, doc:id=>docRef(path+'/'+id),
    onSnapshot(next){ const l=()=>{ const ds=[...docs.keys()].filter(k=>k.startsWith(path+'/')&&k.slice(path.length+1).indexOf('/')<0).map(k=>snap(k)); next({docs:ds,size:ds.length,empty:!ds.length}); }; listeners.add(l); setTimeout(l,0); return ()=>listeners.delete(l); }
  });
  return {doc:docRef, collection:colRef};
}

  catch(e){ if(e && (e.code==='invalid_argument'||e.code==='permission-denied')) writeBlocked=true; console.error(e); }
  busy=false; render();
}

function subscribe(){
  unsubs.forEach(u=>u()); unsubs=[]; game=null; players={}; answers={};
  if(!code) { render(); return; }
  unsubs.push(gameRef().onSnapshot(s=>{ game = s.exists ? s.data() : null; render(); }, e=>{ console.error(e); }));
  unsubs.push(db.collection('games/'+code+'/players').onSnapshot(s=>{ players={}; s.docs.forEach(d=>players[d.id]=d.data()); render(); }, e=>console.error(e)));
  unsubs.push(db.collection('games/'+code+'/answers').onSnapshot(s=>{ answers={}; s.docs.forEach(d=>answers[d.id]=d.data()); render(); }, e=>console.error(e)));
  unsubs.push(db.collection('games/'+code+'/sets').onSnapshot(s=>{ sets={}; s.docs.forEach(d=>sets[d.id]=d.data()); render(); }, e=>console.error(e)));
}
let groupUnsub = null, groupSubKey = null;
function subscribeGroup(){
  const key = game && (game.group || (game.phase==='lobby' && !sim ? groupKey() : null));
  if(key===groupSubKey) return;
  if(groupUnsub){ groupUnsub(); groupUnsub=null; }
  groupSubKey = key; groupSeen = [];
  if(!key || sim) return;
  groupUnsub = db.doc('groups/'+key).onSnapshot(s=>{ groupSeen = (s.exists && Array.isArray(s.data().seen)) ? s.data().seen : []; }, e=>console.warn(e));
}

// ---------- Actions ----------
function freshGame(){ return {code, phase:'lobby', created: Date.now(), turn:0, cat:0, round:0, usedIds:[], order:[], scores:{}, catOrder: shuffle(CATS.map(c=>c.id))}; }
async function createGame(){
  code = newCode();
  await gameRef().set(freshGame());
  location.hash = code;
  subscribe();
}
async function joinGame(name, year, nation){
  store('qm.name',name); store('qm.year',year); store('qm.nation',nation);
  await playerRef().set({name, year, nation, joined: Date.now()});
}
async function startGame(){
  const ids = Object.keys(players);
  const order = shuffle(ids);
  const scores = {}; ids.forEach(id=>scores[id]=0);
  sets = {}; assigning = null;
  const catOrderNow = catOrder();
  await gameRef().set({...game, phase:'pick', order, scores, turn:0, cat:CATS.findIndex(c=>c.id===catOrderNow[0]), round:0, usedIds:[], options:null, question:null, results:null, group: sim?null:groupKey(), ai: !!generator(), catOrder: catOrderNow});
  ensureSet(catOrderNow[0]);
}
async function chooseQuestion(opt){
  judged = {};
  await gameRef().set({...game, phase:'answer', round:(game.round||0)+1, question:{q:opt.q, a:opt.a, d:opt.d||0, custom:!opt.id}, results:null});
}
async function submitAnswer(text){
  await answerRef().set({round: game.round, text, at: Date.now()});
}
async function closeAnswers(){
  await gameRef().set({...game, phase:'judge'});
}
async function reveal(){
  const qm = game.order[game.turn % game.order.length];
  const others = game.order.filter(id=>id!==qm);
  const scores = {...game.scores};
  let correct = 0;
  const marks = {};
  others.forEach(id=>{ const ok = !!judged[id]; marks[id]=ok; if(ok){ correct++; scores[id]=(scores[id]||0)+PLAYER_POINTS; } });
  const qmPts = qmPoints(correct, others.length);
  scores[qm] = (scores[qm]||0) + qmPts;
  const results = {marks, correct, answerers: others.length, qmPts, answers: Object.fromEntries(others.map(id=>[id,(answers[id]&&answers[id].round===game.round)?answers[id].text:'']))};
  await gameRef().set({...game, phase:'reveal', scores, results});
}
async function nextRound(){
  // The Quiz Master role and the category both pass every question.
  const turn = game.turn+1;
  if(turn >= totalTurns()){
    await gameRef().set({...game, phase:'final', question:null, results:null});
    return;
  }
  await gameRef().set({...game, phase:'pick', cat: catIndexForTurn(turn), turn, options:null, question:null, results:null});
}
async function useBankNow(){
  const catId = CATS[game.cat].id;
  await setRef(catId).set({qs:[], source:'bank', at:Date.now(), error:'skipped by Quiz Master'});
}
async function startDemo(){
  sim = true; db = localStore(); code = 'DEMO'; PID = SIM_SEATS[0].id; judged = {};
  await gameRef().set(freshGame());
  for(const [i,s] of SIM_SEATS.entries()) await playerRef(s.id).set({name:s.name, year:s.year, nation:s.nation, joined: Date.now()+i});
  subscribe();
}
function switchSeat(id){ PID = id; draft.answer=''; render(); }
async function autoAnswerOthers(){
  const qm = qmId();
  const others = game.order.filter(id=>id!==qm && !(answers[id]&&answers[id].round===game.round));
  const wrong = ['Not sure…','I’ll guess','Pass','Something else'];
  for(const [i,id] of others.entries()){
    const right = Math.random()<0.5;
    await answerRef(id).set({round: game.round, text: right ? game.question.a : wrong[i%wrong.length], at: Date.now()});
  }
}
async function playAgain(){
  judged={}; sets={}; assigning=null;
  for(const c of CATS){ try{ await setRef(c.id).delete(); }catch(e){} }
  await gameRef().set(freshGame());
}

// ---------- Rendering ----------
function pips(d){ let s='<span class="pips">'; for(let i=1;i<=5;i++) s+='<i class="'+(i<=d?'on':'')+'"></i>'; return s+'</span>'; }
function diffName(d){ return ['','Easy','Fairly easy','Medium','Hard','Very hard'][d]||'Your own'; }
function nameOf(id){ return (players[id]&&players[id].name) || 'Player'; }
function qmId(){ return game && game.order && game.order.length ? game.order[game.turn % game.order.length] : null; }
function isQM(){ return qmId()===PID; }

function render(){
  if(!db){ app.innerHTML = view_boot(); return; }
  let html = '';
  if(sim) html += view_seats();
  if(writeBlocked) html += '<div class="notice err">This page couldn’t save your move. Check your connection and try again.</div>';
  if(!code) html += view_home();
  else if(game===null) html += view_nogame();
  else if(game.phase==='lobby') html += view_lobby();
  else if(game.phase==='final') html += view_final();
  else html += view_round();
  app.innerHTML = html;
  bind();
  subscribeGroup();
  assignOptionsIfNeeded();
  pregenerateInLobby();
}
function pregenerateInLobby(){
  if(!game || game.phase!=='lobby' || sim || !generator()) return;
  const list = Object.entries(players).sort((a,b)=>(a[1].joined||0)-(b[1].joined||0));
  if(!list.length || list[0][0]!==PID) return;   // only the first player's device writes questions
  const co = catOrder();
  ensureSet(co[0]); if(list.length>=2) ensureSet(co[1]);
}

function view_round(){
  const cat = CATS[game.cat];
  const qm = qmId();
  const n = game.order.length;
  const header = `<div class="cat-band" style="background:${cat.color}">
    <p class="eyebrow">Question ${game.turn+1} of ${totalTurns()} · Quiz Master: ${esc(nameOf(qm))}</p>
    <h2>${esc(cat.name)}</h2>
  </div>` + view_scoreboard();
  if(!players[PID]) return header + `<div class="card"><h2>This game is already in progress</h2><p class="muted">You can watch the scores, but you can’t join until the next game.</p></div>`;
  const fn = { pick: view_pick, answer: view_answer, judge: view_judge, reveal: view_reveal }[game.phase] || (()=>'' );
  return header + fn(qm);
}

function view_pick(qm){
  if(!game.options){
    const catId = CATS[game.cat].id;
    const failed = sets[catId] && sets[catId].source==='bank' && sets[catId].error;

  return `<div class="card"><div class="wait"><span class="dot"></span><h2>${esc(nameOf(qm))} is choosing a question…</h2></div></div>`;

function view_answer(qm){
  const others = game.order.filter(id=>id!==qm);
  const inRound = id => answers[id] && answers[id].round===game.round;
  const done = others.filter(inRound);
  const q = game.question;
  const qcard = `<div class="card"><p class="eyebrow">${q.custom?'Quiz Master’s own question':'Question'}</p><p class="big-q">${esc(q.q)}</p></div>`;
  if(isQM()){
    return qcard + `<div class="card">
      <h3>Answers in: ${done.length} of ${others.length}</h3>
      <div class="plist">${others.map(id=>`<div class="prow"><span class="name grow">${esc(nameOf(id))}</span><span class="muted">${inRound(id)?'answered':'thinking…'}</span></div>`).join('')}</div>
      <p class="muted">When everyone’s in, have each player say their answer out loud, then mark them.</p>

    </div>`;

    return qcard + `<div class="card"><p class="eyebrow">Your answer</p><p class="big-q">${esc(answers[PID].text)}</p><p class="muted">Locked in. Waiting for the others (${done.length} of ${others.length}).</p><button class="ghost" data-act="changeanswer">Change it</button></div>`;

  </div>`;
}

function view_judge(qm){
  const others = game.order.filter(id=>id!==qm);
  const q = game.question;
  const ansOf = id => (answers[id]&&answers[id].round===game.round)?answers[id].text:'';
  if(isQM()){

function view_reveal(qm){
  const r = game.results, q = game.question, cat = CATS[game.cat];
  const others = game.order.filter(id=>id!==qm);
  const n = game.order.length, last = game.turn >= totalTurns()-1;
  const nextQm = game.order[(game.turn+1)%n], nextCat = last ? null : CATS[catIndexForTurn(game.turn+1)];

    <div class="row"><h3 class="grow">${r.correct} of ${r.answerers} got it</h3><span class="delta">${esc(nameOf(qm))} +${r.qmPts}</span></div>
    <div class="curve">${[0,.25,.5,.75,1].map(p=>`<span><b>${Math.round(QM_MAX*4*p*(1-p))}</b>${Math.round(p*100)}%</span>`).join('')}</div>
    <div class="plist">${others.map(id=>`<div class="prow"><div class="grow"><div class="name">${esc(nameOf(id))}</div><div class="ans">${esc(r.answers[id])||'<i>no answer</i>'}</div></div><span class="mark ${r.marks[id]?'good':'bad'}">${r.marks[id]?'+'+PLAYER_POINTS:'0'}</span></div>`).join('')}</div>
    ${isQM()?`<button class="primary" data-act="next" ${busy?'disabled':''}>${last?'See final scores':'Pass to '+esc(nameOf(nextQm))+' · '+esc(nextCat.name)}</button>`:`<p class="muted">Waiting for ${esc(nameOf(qm))} to move on.</p>`}
  </div>`;

function view_scoreboard(){
  const qm = qmId();
  const rows = game.order.slice().sort((a,b)=>(game.scores[b]||0)-(game.scores[a]||0));
  return `<div class="scoreboard"><p class="eyebrow">Scores</p><div class="rows">${rows.map(id=>`<div class="srow ${id===PID?'me':''}"><span class="nm">${esc(nameOf(id))}${id===PID?' (you)':''} ${id===qm?'<span class="qm-tag">QM</span>':''}</span><span class="sc">${game.scores[id]||0}</span></div>`).join('')}</div></div>`;

function view_final(){
  const rows = game.order.slice().sort((a,b)=>(game.scores[b]||0)-(game.scores[a]||0));
  const top = game.scores[rows[0]]||0;
  return `<div class="card"><p class="eyebrow">Final scores</p><h1>${esc(nameOf(rows[0]))} wins</h1></div>
  <div class="final">${rows.map((id,i)=>`<div class="frow ${(game.scores[id]||0)===top?'first':''}"><span class="rank">${i+1}</span><span class="grow name">${esc(nameOf(id))}${id===PID?' (you)':''}</span><span class="sc delta">${game.scores[id]||0}</span></div>`).join('')}</div>
  <div class="card"><button class="primary" data-act="again" ${busy?'disabled':''}>Play again with the same code</button><button class="ghost" data-act="leave">Leave</button></div>`;
}

// ---------- Event binding ----------
function bind(){
  app.querySelectorAll('select').forEach(sel=>sel.addEventListener('change', e=>{ if(e.target.id==='nation') draft.nation=e.target.value; }));
  app.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{ const m={name:'name',year:'year',answer:'answer',custom:'custom',customa:'customA'}; if(m[e.target.id]) draft[m[e.target.id]]=e.target.value; });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const b=inp.closest('.card').querySelector('button.primary, button[data-act]'); if(b) b.click(); } });
  });
  app.querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click', ()=>act(btn.dataset)));
}
function act(d){
  switch(d.act){
    case 'create': return safeWrite(createGame);
    case 'demo': return safeWrite(startDemo);
    case 'seat': return switchSeat(d.id);
    case 'autoanswer': return safeWrite(autoAnswerOthers);
    case 'exitdemo': { sim=false; code=null; db=realDb; PID=store('qm.pid'); location.hash=''; subscribe(); return; }
    case 'joincode': { const v=(document.getElementById('joincode').value||'').trim().toUpperCase(); if(/^[A-Z0-9]{4}$/.test(v)){ code=v; location.hash=v; subscribe(); } return; }
    case 'leave': sim=false; code=null; db=realDb; PID=store('qm.pid'); location.hash=''; subscribe(); return;
    case 'copylink': { const url=location.href.split('#')[0].replace(/\/?$/,'/')+'#'+code; navigator.clipboard.writeText(url).then(()=>{},()=>{}); return; }
    case 'join': { const name=draft.name.trim(), year=draft.year.trim(), nation=draft.nation; if(!name||!/^\d{4}$/.test(year)||!nationOf(nation)) return; return safeWrite(()=>joinGame(name,year,nation)); }
    case 'start': return safeWrite(startGame);
    case 'pick': return safeWrite(()=>chooseQuestion(game.options[+d.i]));
    case 'pickcustom': { const q=draft.custom.trim(), a=draft.customA.trim(); if(!q||!a) return; draft.custom=''; draft.customA=''; return safeWrite(()=>chooseQuestion({q,a,d:0})); }
    case 'answer': { const t=draft.answer.trim(); if(!t) return; draft.answer=''; return safeWrite(()=>submitAnswer(t)); }
    case 'changeanswer': draft.answer=answers[PID].text; return safeWrite(()=>answerRef().delete());
    case 'close': return safeWrite(closeAnswers);
    case 'mark': judged[d.id] = d.v==='1'; render(); return;
    case 'reveal': return safeWrite(reveal);
    case 'next': return safeWrite(nextRound);
    case 'usebank': return safeWrite(useBankNow);
    case 'again': return safeWrite(playAgain);
  }
}

// ---------- Firestore adapter (same shape as the demo store) ----------
function fsStore(fs, M){
  const wrap = d=>({id:d.id, exists:d.exists(), data:()=>d.data()});
  const docRef = path=>({
    id:path.split('/').pop(), path,
    async get(){ return wrap(await M.getDoc(M.doc(fs,path))); },
    set(data){ return M.setDoc(M.doc(fs,path), JSON.parse(JSON.stringify(data))); },
    delete(){ return M.deleteDoc(M.doc(fs,path)); },
    onSnapshot(next,err){ return M.onSnapshot(M.doc(fs,path), d=>next(wrap(d)), err); }
  });
  const colRef = path=>({
    path, doc:id=>docRef(path+'/'+id),
    onSnapshot(next,err){ return M.onSnapshot(M.collection(fs,path), q=>next({docs:q.docs.map(wrap), size:q.size, empty:q.empty}), err); }
  });
  return {doc:docRef, collection:colRef};
}

// ---------- Gemini question writer (Firebase AI Logic) ----------
function makeGeminiGenerator(ai, getGenerativeModel, Schema){
  const schema = Schema.array({ items: Schema.object({
    properties: { q: Schema.string(), a: Schema.string(), d: Schema.integer(), y: Schema.integer({nullable:true}) },
    optionalProperties: ['y']
  })});
  // The no-cost tier allows about 20 requests per day per model, so walk a ladder of models
  // (each with its own quota) before giving up and letting the bank take over.
  const MODELS = ['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite','gemini-3.1-flash-lite'];
  const models = MODELS.map(m=>getGenerativeModel(ai, { model:m, generationConfig:{ responseMimeType:'application/json', responseSchema:schema, temperature:1.0 } }));
  let start = 0; // remember which model last worked so we don't re-hit exhausted ones
  return async function(cat, count, years, avoid, nations){
    const per = Math.max(2, Math.round(count/5));
    const oldest = years.length?Math.min(...years):1960;
    const names = (nations||[]).map(id=>nationOf(id).name);
    let where;
    if(names.length===1){
      where = `All players are from ${names[0]}. Write for people who grew up there: their sports, television, music, public figures, history and everyday culture are fair game, and some questions should be about ${names[0]} itself. Use that country's spelling and vocabulary. Still include some world items.`;
    } else if(names.length>1){
      where = `Players are from different countries: ${names.join(', ')}. This is a mixed table, so every question must be about something famous in ALL of those countries equally. Do not ask about anything known mainly in one of them: domestic leagues, teams and players (NFL, MLB, NHL, college sports, cricket, rugby union or league, AFL, NRL, Gaelic games, CFL), country-specific TV shows, presenters, comedians and news anchors, politicians below head-of-government level, state, provincial or county facts, local chains, brands, foods or holidays, and national-only history or school curriculum. Safe ground: the Olympics, FIFA World Cup, Formula 1, tennis Grand Slams, golf majors, global superstars, Hollywood films, worldwide music acts, world history, science, geography and literature. Use neutral spelling and avoid country-specific units or terms.`;
    } else {
      where = `Players are English speakers from unknown countries; stick to subjects famous across the English-speaking world rather than any one country.`;
    }
    const prompt = `You write questions for a living-room trivia game played by friends. Category: ${cat.name} (in the spirit of the Trivial Pursuit "${cat.name}" wedge).
Players were born in: ${years.length?years.join(', '):'the 1970s to 2000s'}. Favor subjects from roughly ${oldest} onward that these players lived through, mixed with timeless classics everyone grows up learning. Avoid events from the last 12 months.
${where}
Write exactly ${per*5} questions: ${per} at each difficulty 1, 2, 3, 4 and 5. Difficulty 1 = a gimme: everyone at the table, including people who never play trivia, answers instantly (household names, the most famous landmarks, blockbuster films, grade-school facts); 2 = most adults know it; 3 = a reasonably informed adult has a fair shot; 4 = a regular trivia-night player would get it; 5 = only a committed trivia fan would know it. Judge difficulty by how well the players described above would know it, not by how obscure it is in general.
Rules: each question is at most 18 words and reads naturally aloud; each has one clear, verifiable answer of 1 to 5 words; no true/false, no multiple choice, no "which of these"; no two questions about the same subject; the question must not contain its own answer. Set y to the year the subject is most associated with, or null if timeless.
Do not reuse or closely paraphrase any of these questions the group has already seen:
${avoid.length?avoid.map(t=>'- '+t).join('\n'):'(none yet)'}
Return only a JSON array of objects with keys q, a, d, y.`;
    let lastErr = null;
    for(let i=start; i<models.length; i++){
      try{
        const res = await models[i].generateContent(prompt);
        const text = res.response.text().trim().replace(/^```(?:json)?\s*/,'').replace(/```$/,'');
        const parsed = JSON.parse(text);
        start = i;
        return parsed;
      }catch(e){
        lastErr = e;
        const msg = String(e && e.message || e);
        const quota = /429|quota|RESOURCE_EXHAUSTED/i.test(msg);
        const missing = /404|not found|NOT_FOUND/i.test(msg);
        console.warn('Question writer '+MODELS[i]+' failed'+(quota?' (quota)':missing?' (unavailable)':''), msg.slice(0,160));
        if(quota || missing){ if(i===start) start = i+1; continue; }
        throw e;
      }
    }
    throw lastErr || new Error('no model available');
  };
}

// ---------- Boot ----------
let realDb = null;
window.addEventListener('hashchange', ()=>{ if(sim) return; const c=codeFromHash(); if(c!==code){ code=c; if(db) subscribe(); } });
render();
// Shared fallback bank stored in Firestore under the reserved code BANK (one doc per category).
function loadSharedBank(store){
  const have = new Set(BANK.map(q=>q.q.toLowerCase()));
  CATS.forEach(c=>{
    store.doc('games/BANK/sets/'+c.id).get().then(snap=>{
      if(!snap.exists) return;
      let added=0;
      (snap.data().qs||[]).forEach((q,i)=>{
        if(!q||!q.q||!q.a||have.has(String(q.q).toLowerCase())) return;
        have.add(String(q.q).toLowerCase());
        BANK.push({id:'b'+c.id+'_'+i, c:c.id, d:Math.min(5,Math.max(1,+q.d||3)), y:(+q.y>1000?+q.y:null), q:String(q.q), a:String(q.a)});
        added++;
      });
      if(added) console.info('Shared bank: +'+added+' '+c.name);
    }).catch(e=>console.warn('Shared bank unavailable for '+c.id, e));
  });
}
window.QM_boot = function(store, gen){
  realDb = store; liveGen = gen;
  if(realDb) loadSharedBank(realDb);
  if(!realDb){
    app.innerHTML='<div class="card"><p class="eyebrow">Quiz Master</p><h2>Live games aren’t set up yet</h2><p class="muted">The shared game store hasn’t been configured on this site. You can still try the 4-player demo on this device.</p><button data-act="demo">Start 4-player demo</button></div>';
    bind(); return;
  }
  db = realDb; subscribe();
};

if(cfg && cfg.projectId){
  const fbApp = initializeApp(cfg);

  const fs = getFirestore(fbApp);
  let gen = null;

} else {

}
